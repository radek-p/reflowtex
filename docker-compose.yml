#
# Standalone use (no VS Code / Dev Containers needed):
#   docker compose run --rm reflowtex make check
#   docker compose run --rm --service-ports reflowtex make serve
services:
  reflowtex:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
      # node_modules holds native modules (sharp, for the pageless tools) built
      # for the container's Linux/glibc target. Bind-mounting it straight from
      # the repo would make it fight with a host-native node_modules
      # (macOS/Mach-O) every time you switch between running `make` in and out
      # of the container. A named volume mounted on top of that one path keeps
      # it container-only.
      - reflowtex-node-modules:/workspace/node_modules
    ports:
      - "8000:8000"   # examples/demo (make serve), vanilla integration
      - "1313:1313"   # website/ dev server (hugo server / build.sh server)
    command: bash
    tty: true
    stdin_open: true

volumes:
  reflowtex-node-modules:
