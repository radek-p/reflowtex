name: TypeScript

# The TypeScript build pipeline (src/pipeline): type checking and unit tests.
# Needs no TeX installation – the tests that compile documents are the
# parity and render tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
