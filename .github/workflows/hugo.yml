name: Deploy website

# Builds the site inside the CI image (a real TeX toolchain, pinned; see
# ci-image.yml) and publishes the result to GitHub Pages. Nothing under
# website/public is committed: what is deployed is exactly what this job built.
#
# It runs once CI has run for a push to main, whatever CI's verdict (a failing
# test does not stop the deploy; the CI run is what fails a change): by then
# the image is in the registry, and the render tests' results for the commit
# are CI's to download, so neither is made twice. Run by hand, it makes both
# itself.
#
# The paper corpus's results (Showcase, Accuracy, and the corpus batch of the
# render report) are the newest successful run's of the Corpus workflow
# (corpus.yml), which runs when what they depend on changes; when it
# finishes, this runs again to publish them.

on:
  workflow_run:
    workflows: [CI, Corpus]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push' || github.event.workflow_run.name == 'Corpus'
    uses: ./.github/workflows/ci-image.yml

  build:
    needs: image
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the commit CI ran for (a run by hand: the branch's head)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - run: .github/scripts/ci-image.sh login && .github/scripts/ci-image.sh pull "$IMAGE"

      # The pipeline is incremental by content hash: restoring the previous
      # run's per-block build tree and the (slow, multi-pass) testmath demo
      # means only blocks whose content changed are recompiled.
      - uses: actions/cache@v4
        with:
          path: |
            website/.reflowtex-build
            website/data/latex_blocks
            website/static/testmath
            website/static/pixel-compare
            website/data/pixel_compare.json
          key: website-blocks-${{ hashFiles('src/**', 'examples/**', 'website/content/**', 'website/latex-preambles/**', 'integrations/hugo/**', 'Dockerfile', 'docker/**') }}
          restore-keys: |
            website-blocks-

      # Tools › Render tests shows the render tests of the version it is part
      # of: CI ran them for this commit, and build.sh copies their results
      # into the site. (None there – CI's render job did not get as far: the
      # page says it has no results.)
      - name: The render tests' results, from CI
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: render-results
          path: tests/render/build/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # (after the corpus: CI's newest finished run on main has them)
      - name: The render tests' results, from CI's newest run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Corpus'
        continue-on-error: true
        run: |
          id=$(gh run list --workflow ci.yml --branch main --status completed --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$id" --name render-results --dir tests/render/build/
      - name: The paper corpus's results, from its newest successful run
        continue-on-error: true
        run: |
          id=$(gh run list --workflow corpus.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$id" ] || { echo "no successful corpus run yet: the site shows the committed data/corpus.json"; exit 0; }
          # into a folder of its own, then over website/: the download does not overwrite the committed data/corpus.json
          gh run download "$id" --name corpus-site --dir "$RUNNER_TEMP/corpus-site"
          cp -R "$RUNNER_TEMP/corpus-site/." website/
      - name: Run the render tests, for the site (a run by hand)
        if: github.event_name != 'workflow_run'
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace reflowtex:test \
            bash -lc 'npm ci --no-audit --no-fund && { make test-render-all || echo "render tests failed: the site shows which"; }'

      - name: Build the site in the container
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace reflowtex:test \
            bash -lc 'npm ci --no-audit --no-fund && make website'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
