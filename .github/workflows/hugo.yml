name: Deploy website

# Builds the site inside the project's own container image (a real TeX
# toolchain, pinned) and publishes the result to GitHub Pages. Nothing under
# website/public is committed: what is deployed is exactly what this job built.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image the render tests run in (the build's, with Chromium): the
      # site shows their results. Layers come from the Actions cache, so this
      # is seconds unless the Dockerfile changed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: reflowtex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The pipeline is incremental by content hash: restoring the previous
      # run's per-block build tree and the (slow, multi-pass) testmath demo
      # means only blocks whose content changed are recompiled.
      - uses: actions/cache@v4
        with:
          path: |
            website/.reflowtex-build
            website/data/latex_blocks
            website/static/testmath
            website/static/pixel-compare
            website/data/pixel_compare.json
          key: website-blocks-${{ hashFiles('src/**', 'examples/**', 'website/content/**', 'website/latex-preambles/**', 'integrations/hugo/**', 'Dockerfile') }}
          restore-keys: |
            website-blocks-

      # Tools › Render tests shows the render tests of the version it is part
      # of: they run here, for this commit, and build.sh copies their results
      # into the site. A failing test does not stop the deploy – the page shows
      # it; the Render tests workflow is what fails a change.
      - name: Run the render tests, for the site
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace reflowtex:ci \
            bash -lc 'npm ci --no-audit --no-fund && { make test-render-all || echo "render tests failed: the site shows which"; }'

      - name: Build the site in the container
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace reflowtex:ci \
            bash -lc 'make website'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
