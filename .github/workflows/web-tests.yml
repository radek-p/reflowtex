name: Web tests

# What a site built with Reflow TeX does in the browser (tests/web/README.md):
# the viewer's features, the companion package's browser side and the Hugo
# integration, in Chromium and WebKit. Separate from the render tests, which
# check glyph positions against TeX.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: reflowtex:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the web tests
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            reflowtex:test bash -lc '
              set -e
              npm ci --no-audit --no-fund
              make test-web
            '

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-logs
          path: |
            tests/web/build/*.log
            tests/web/build/test-results/
          if-no-files-found: ignore
