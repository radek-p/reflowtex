# The render tests: each case is compiled to a pageless PDF and shown by the
# viewer, and every glyph the browser draws is compared with TeX's (see
# README.md). Settings here apply to every case unless a case overrides them.

[defaults]
# Widths to test, as changes to the document's own \textwidth (pt): 0 is the
# width it was typeset at; the others make the browser break the lines
# again, and TeX is compiled at that width to say where they should be.
widths = [0, -100, 85]
# Largest distance (pt) between a glyph in the browser and the same glyph in
# the PDF, across and down; and for rules (rule_tolerance, the same unless
# given). This is the target every case is to meet; each case below has
# its own ceiling, the worst it attains today, which may only go down.
tolerance = 0.05
# lualatex passes (2 or 3 for references).
passes = 2

# Each case has a section with its ceilings: `tolerance` (and
# `rule_tolerance` where it draws rules) is the worst it attains today,
# across all its widths, so that it can only get better – when a run shows
# it doing better, lower them to match. `known` marks a case
# that fails for a reason on record: it runs as an expected failure, and
# when it passes again the suite says so, to have the mark taken off. The document itself is
# cases/<name>.tex, unless `file` names another (from the repository root).

# Worst attained 2026-09-26.

[testmath]
file = "examples/testmath/testmath.tex"
template = "examples/testmath/template.tex"
passes = 3
widths = [0]
slow = true
# All 41 566 glyphs found; 165 rules.
tolerance = 0.092
rule_tolerance = 0.4

[alignments]
tolerance = 0.012

[displays]
tolerance = 0.01
rule_tolerance = 0.004

[footnotes]
tolerance = 0.009

[inline-math]
tolerance = 0.009
rule_tolerance = 0.001

[lists-headings]
tolerance = 0.009

[microtype]
tolerance = 0.014

[paragraph]
tolerance = 0.009
