<script>
  // A badge drawn with the viewer's host API alone (no companion): an inline
  // kind whose label may break at its spaces (the segments form). Its label
  // is the instance's own state; set(text) changes it and measures again.
  (function () {
    var LABEL = 'checked by Lean on 25 September 2026';
    var labels = {}, envs = {};
    function words(i) { return (labels[i.id] || LABEL).split(' '); }
    function define(host) {
      host.define('badge', {
        measure: function (instance, env) {
          envs[instance.id] = env;
          window.__measured = (window.__measured || 0) + 1;
          var m = function (t) { return env.measure('<span class="badge" style="padding:0">' + t + '</span>'); };
          var space = m('a b').width - m('ab').width;
          return {
            segments: words(instance).map(function (w) { return m(w); }),
            gaps: words(instance).slice(1).map(function () { return { width: space, penalty: 100 }; }),
            ends: { left: { cap: 4, cut: 4 }, right: { cap: 4, cut: 4 } },
          };
        },
        render: function (instance, host) {
          var p = host.piece;
          host.el.innerHTML = '<span class="badge' + (p.left === 'cut' ? ' cut-left' : '') + (p.right === 'cut' ? ' cut-right' : '')
            + '">' + words(instance).slice(p.from, p.to + 1).join(' ') + '</span>';
          window.__pieces = (window.__pieces || 0) + 1;
          return function () { window.__pieces--; };
        },
      });
      window.__badge = { set: function (text) {
        var i = host.instances('badge')[0]; labels[i.id] = text; envs[i.id].invalidate(); } };
    }
    if (window.reflowtex && reflowtex.host) define(reflowtex.host);
    else document.addEventListener('reflowtex:host', function (e) { define(e.detail.host); }, { once: true });
  })();
</script>
<style>.badge { display: inline-block; padding: 0 4px; background: #2f2ccd; color: #fff; font: 600 .7em/1.6 sans-serif; border-radius: 99px; }</style>
