<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- Inline SVG favicon (an integral sign). Without a favicon the browser still
     requests /favicon.ico and logs a 404; this satisfies it with no extra file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Ctext%20x='3'%20y='13'%20font-size='15'%20font-family='Georgia,serif'%20fill='%23888'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">

<!-- Theme: latex-viewer.js keys its colour maps off a class on <html>. `light` is
     the default (no class); `dark`, `sepia`, `contrast` each remap default ink,
     red/blue, and the page background. Set the class before first paint (from the
     saved choice, else the OS preference) so text is never briefly invisible; the
     reading panel (bottom-right) calls window.__setTheme to change it live. -->
<script>
  (function () {
    var KEY = 'reflowtex-theme';
    function set(t) {
      var root = document.documentElement;
      root.classList.remove('dark', 'sepia', 'contrast');
      if (t !== 'light') root.classList.add(t);
      root.setAttribute('data-theme', t);
      try { localStorage.setItem(KEY, t); } catch (e) {}
    }
    var saved; try { saved = localStorage.getItem(KEY); } catch (e) {}
    set(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    window.__setTheme = set;
  })();
</script>

<!-- Content width: 'auto' is the fluid column (a max-width, shrinking below it);
     'narrow'/'normal'/'wide' pin it to a fixed measure that overflows into a
     horizontal scroll when the window is narrower. Set from the saved choice
     before first paint – like the theme – so the blocks lay out at the chosen
     width immediately rather than reflowing once after load. The reading panel (bottom-
     right) calls window.__setWidth, which resizes #lt-content; the viewer's
     ResizeObserver reflows each block to the new width. -->
<script>
  (function () {
    var KEY = 'reflowtex-width';
    function set(w) {
      document.documentElement.setAttribute('data-width', w);
      try { localStorage.setItem(KEY, w); } catch (e) {}
    }
    var saved; try { saved = localStorage.getItem(KEY); } catch (e) {}
    set(saved || 'auto');
    window.__setWidth = set;
  })();
</script>

<!-- Page zoom: emulates the browser's own Cmd/Ctrl +/- with CSS `zoom` on the
     content, so the whole document scales (line breaks unchanged, like zooming a
     PDF) and a fixed-width column can overflow into a horizontal scroll. Applied
     via a custom property on <html> so it is in force before #lt-content exists
     (no first-paint flash). window.__zoom(dir): dir<0 smaller, 0 reset, dir>0
     bigger; the reset button doubles as a live percentage readout. A synthetic
     resize event nudges the viewer to repaint the (now differently sized) viewport
     – scaling does not fire its ResizeObserver, which keys off unzoomed widths. -->
<script>
  (function () {
    var KEY = 'reflowtex-zoom', MIN = 0.5, MAX = 3, STEP = 1.1, z = 1;
    function clamp(v) { return Math.min(MAX, Math.max(MIN, v)); }
    function apply() {
      document.documentElement.style.setProperty('--lt-zoom', z);
      var el = document.getElementById('zoom-level');
      if (el) el.textContent = Math.round(z * 100) + '%';
      try { localStorage.setItem(KEY, String(z)); } catch (e) {}
      window.dispatchEvent(new Event('resize'));
    }
    var saved; try { saved = parseFloat(localStorage.getItem(KEY)); } catch (e) {}
    if (saved > 0) z = clamp(saved);
    document.documentElement.style.setProperty('--lt-zoom', z);   // before first paint
    window.__zoom = function (dir) { z = dir === 0 ? 1 : clamp(z * (dir > 0 ? STEP : 1 / STEP)); apply(); };
    document.addEventListener('DOMContentLoaded', function () {    // fill the readout
      var el = document.getElementById('zoom-level');
      if (el) el.textContent = Math.round(z * 100) + '%';
    });
  })();
</script>

<!-- reflowtex embeds the schema (schema/latex.proto as base64 text) once per page;
     latex-viewer.js parses it at runtime. -->
<div id="latex-schema" data-schema-b64="{{SCHEMA_B64}}" hidden></div>

<!-- Font URL map: original filename → served filename (a modified font is served
     renamed + content-hashed). latex-viewer.js reads it to build @font-face.
     data-fonts-base is the URL prefix for those files – the default 'fonts/'
     resolves against latex-viewer.js's own URL (see build.py --fonts-base),
     which works under a subpath, a different domain, or opened straight off
     disk over file://, with no reconfiguration. -->
<script id="latex-font-map" type="application/json" data-fonts-base="{{FONTS_BASE}}">{{FONT_MAP_JSON}}</script>

<style>
  :root { color-scheme: light dark; }
  /* Page palette lives on <html> (not <body>) so it also fills the strip a
     fixed-width column reveals when it overflows into a horizontal scroll.
     Driven by html.dark etc. (set by the theme script), which the viewer keys
     its colour maps off too – so text and background stay in step. */
  html {
    background: #fafaf9; color: #333333;
    transition: background 150ms ease, color 150ms ease;
  }
  html.dark     { background: #0c0a09; color: #e7e5e4; }
  html.sepia    { background: #f4ecd8; color: #453a26; }
  html.contrast { background: #ffffff; color: #000000; }
  /* The page's colour, for the viewer: the footnote popover is filled with
     it and tints are mixed against it. Without it the viewer falls back to
     Canvas, which follows the system's light/dark, not this page's theme. */
  html          { --latex-page-bg: #fafaf9; }
  html.dark     { --latex-page-bg: #0c0a09; }
  html.sepia    { --latex-page-bg: #f4ecd8; }
  html.contrast { --latex-page-bg: #ffffff; }
  body {
    margin: 0; min-height: 100vh;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    line-height: 1.6;
  }
  h1 { font-weight: 700; }

  /* ── The content column ──────────────────────────────────────────────────
     Holds the title and every block, centred with a reading measure. The width
     switch retargets it and the zoom control scales it (see the head scripts);
     both act here rather than on <body> so the reading panel and the
     citation popover – siblings in <body> – are neither resized nor scaled. */
  #lt-content {
    max-width: 46rem; margin: 3rem auto; padding: 0 1.25rem;
    zoom: var(--lt-zoom, 1);
  }
  /* Fixed widths carry no viewport cap: a column wider than the window overflows
     into a horizontal scroll rather than shrinking. No width transition –
     animating it would fire the viewer's ResizeObserver every frame and re-break
     every paragraph. */
  html[data-width="narrow"] #lt-content { max-width: none; width: 34rem; }
  html[data-width="normal"] #lt-content { max-width: none; width: 46rem; }
  html[data-width="wide"]   #lt-content { max-width: none; width: 64rem; }

  /* ── Reading options (bottom-right) ─────────────────────────────────────
     One round "Aa" button that opens a small panel: text size, colour theme,
     column width, and the inspector. A frosted material in the page's own
     colour per theme. The buttons call window.__zoom / __setTheme /
     __setWidth (defined in <head>); it sits outside #lt-content, so the
     width and zoom it sets do not resize or scale it. */
  html          { --lt-glass: rgba(250, 250, 249, .74); --lt-seg-on: #ffffff; }
  html.dark     { --lt-glass: rgba(34, 31, 29, .74);    --lt-seg-on: #4a4541; }
  html.sepia    { --lt-glass: rgba(244, 236, 216, .80); --lt-seg-on: #fbf6ea; }
  html.contrast { --lt-glass: rgba(255, 255, 255, .92); --lt-seg-on: #ffffff; }
  #lt-reader {
    --lt-hair: color-mix(in srgb, currentColor 16%, transparent);
    --lt-accent: var(--latex-link, #2f6fb3);
    position: fixed; z-index: 1000;
    right: max(1rem, env(safe-area-inset-right)); bottom: max(1rem, env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", ui-sans-serif, system-ui, sans-serif;
    line-height: normal; -webkit-font-smoothing: antialiased;
  }
  #lt-reader-button, #lt-reader-panel {
    background: var(--lt-glass);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border: .5px solid var(--lt-hair); color: inherit;
  }
  #lt-reader-button {
    width: 44px; height: 44px; border-radius: 50%; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 6px 20px rgb(0 0 0 / .12), 0 1px 3px rgb(0 0 0 / .08);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #lt-reader-button:hover { box-shadow: 0 8px 26px rgb(0 0 0 / .16), 0 1px 3px rgb(0 0 0 / .1); }
  #lt-reader-button:active, #lt-reader-button[aria-expanded="true"] { transform: scale(.94); }
  /* One size for both letters: a smaller capital would come out no taller
     than the lowercase a. */
  .lt-aa { font: 18px/1 ui-serif, "New York", Georgia, serif; letter-spacing: .01em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #lt-reader-panel {
    position: absolute; right: 0; bottom: 56px; width: 272px; padding: 6px;
    border-radius: 20px; box-sizing: border-box;
    box-shadow: 0 18px 50px rgb(0 0 0 / .18), 0 2px 6px rgb(0 0 0 / .08);
    transform-origin: bottom right; animation: lt-pop .22s cubic-bezier(.2, .9, .25, 1.05);
  }
  #lt-reader-panel[hidden] { display: none; }
  @keyframes lt-pop { from { opacity: 0; transform: translateY(6px) scale(.92); } }
  @media (prefers-reduced-motion: reduce) { #lt-reader-panel { animation: none; } #lt-reader-button { transition: none; } }
  .lt-row { padding: 10px 8px; }
  .lt-row + .lt-row { border-top: .5px solid var(--lt-hair); }
  .lt-row button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .lt-row button:focus-visible, #lt-reader-button:focus-visible { outline: 2px solid var(--lt-accent); outline-offset: 2px; }
  .lt-caption { font-size: 11px; opacity: .6; margin: 0 0 8px; }
  /* The inspector entry: a plain row, its shortcut on the right. */
  .lt-inspect-row {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 13px; padding: 6px 6px; border-radius: 10px; text-align: left;
  }
  .lt-inspect-row:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .lt-inspect-row kbd { font: 11px ui-monospace, Menlo, monospace; opacity: .6; }
  /* Text size: small A · percentage · large A. The percentage is the reset. */
  .lt-size { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; }
  .lt-size button { height: 36px; border-radius: 10px; }
  .lt-size button:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .lt-size [data-z="out"] { font: 500 14px ui-serif, "New York", Georgia, serif; }
  .lt-size [data-z="in"]  { font: 500 21px ui-serif, "New York", Georgia, serif; }
  .lt-size #zoom-level { font-size: 13px; font-variant-numeric: tabular-nums; opacity: .75; }
  /* Theme: four swatches with names. */
  .lt-themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .lt-themes button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; padding: 2px 0; }
  .lt-themes button span { opacity: .7; }
  .lt-themes button[aria-checked="true"] span { opacity: 1; font-weight: 600; }
  .lt-swatch {
    width: 34px; height: 34px; border-radius: 50%;
    box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .22);
    font-family: ui-serif, "New York", Georgia, serif; font-size: 14px;
    display: grid; place-items: center; opacity: 1 !important; font-weight: 400 !important;
  }
  [data-t="light"]    .lt-swatch { background: #fafaf9; color: #333; }
  [data-t="dark"]     .lt-swatch { background: #1c1917; color: #e7e5e4; }
  [data-t="sepia"]    .lt-swatch { background: #f4ecd8; color: #453a26; }
  [data-t="contrast"] .lt-swatch { background: #fff; color: #000; box-shadow: inset 0 0 0 1.5px #000; }
  .lt-themes button[aria-checked="true"] .lt-swatch { outline: 2.5px solid var(--lt-accent); outline-offset: 2.5px; }
  /* Width: a segmented control. */
  .lt-seg {
    display: grid; grid-template-columns: repeat(4, 1fr); padding: 2px; gap: 2px;
    border-radius: 9px; background: color-mix(in srgb, currentColor 9%, transparent);
  }
  .lt-seg button { font-size: 12px; padding: 6px 0; border-radius: 7px; opacity: .8; }
  .lt-seg button[aria-checked="true"] {
    opacity: 1; font-weight: 600; background: var(--lt-seg-on);
    box-shadow: 0 1px 3px rgb(0 0 0 / .14), 0 0 0 .5px rgb(0 0 0 / .04);
  }
  @media (max-width: 30rem) {
    #lt-reader-panel { position: fixed; left: 12px; right: 12px; width: auto;
      bottom: calc(max(1rem, env(safe-area-inset-bottom)) + 56px); }
  }
  @media print { #lt-reader { display: none; } }
  /* ── The viewer's rendering surface ──────────────────────────────────────
     latex-viewer.js reads each block's pixel width from its box, lays the SVG
     out to that width, and (for a display that overflows the column) wraps it
     in a .latex-display scroll box it creates itself. These rules are the
     minimum the rendered SVG needs; copy them into any page that hosts a
     block. */
  /* Each block is a self-contained snippet (with its own \section heading, if
     any); give neighbours room to read as separate sections. */
  .latex-block { margin: 2.75rem 0; overflow: visible; }
  .latex-block svg {
    display: block; max-width: 100%; overflow: visible;
    font-weight: normal !important; font-style: normal !important;
  }
  .latex-block svg text, .latex-block svg tspan {
    font-weight: normal !important; font-style: normal !important;
    fill: currentColor;
  }
  /* A display wide enough to overflow the column becomes horizontally
     scrollable. Setting overflow-x forces overflow-y to auto, which would clip
     ascenders/descenders, so the renderer measures the overhang and reserves it
     as padding (the 4px here is only the pre-measure base). */
  .latex-display {
    /* Use at most 100px of each page margin, but never extend past the viewport.
       The inline padding keeps x=0 aligned with the prose column. */
    --latex-display-peek: clamp(0px, calc(50vw - 50%), 100px);
    box-sizing: border-box;
    margin-inline: calc(0px - var(--latex-display-peek));
    /* The trailing peek is a real box (the ::after below), not padding on this
       element. A scroll container's *end* padding is not part of the scrollable
       overflow in every engine – WebKit drops it – and where it is dropped the
       display can no longer be panned the whole distance it overflows the
       column, so its last glyphs can never be brought level with the text edge.
       A flex item's border box is counted everywhere. Start padding is counted
       everywhere too, so the leading peek stays padding and keeps x=0 on the
       prose column. */
    display: flex;
    align-items: flex-start;   /* or the SVG would be stretched to the row */
    padding: 4px 0 4px var(--latex-display-peek);
    overflow-x: auto;
  }
  .latex-display::after {
    content: ''; align-self: stretch;
    flex: 0 0 var(--latex-display-peek);
  }
  .latex-display.latex-overflow-right:not(.latex-overflow-left) {
    -webkit-mask-image: linear-gradient(to right, #000 0,
      #000 calc(100% - var(--latex-display-peek)), transparent 100%);
    mask-image: linear-gradient(to right, #000 0,
      #000 calc(100% - var(--latex-display-peek)), transparent 100%);
  }
  .latex-display.latex-overflow-left:not(.latex-overflow-right) {
    -webkit-mask-image: linear-gradient(to right, transparent 0,
      #000 var(--latex-display-peek), #000 100%);
    mask-image: linear-gradient(to right, transparent 0,
      #000 var(--latex-display-peek), #000 100%);
  }
  .latex-display.latex-overflow-left.latex-overflow-right {
    -webkit-mask-image: linear-gradient(to right, transparent 0,
      #000 var(--latex-display-peek),
      #000 calc(100% - var(--latex-display-peek)), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0,
      #000 var(--latex-display-peek),
      #000 calc(100% - var(--latex-display-peek)), transparent 100%);
  }
  .latex-display > svg { max-width: none; flex: 0 0 auto; }
  /* ── Cross-references ────────────────────────────────────────────────────
     A \ref is a *set* of glyphs sharing data-link, not one element, so the
     viewer toggles these classes across the whole set: hovering any part of a
     reference lights all of it, including when it broke across two lines.
     Colour only – nothing here may change a glyph's size or position, or the
     text would reflow under the pointer. Glyph fill is set inline when TeX
     coloured it, hence the !important. */
  .latex-block svg .latex-link {
    fill: var(--latex-link, #2f6fb3) !important;
    cursor: pointer;
  }
  .latex-block svg .latex-link.latex-link-hover {
    fill: var(--latex-link-hover, #1a4d85) !important;
    /* The underline is drawn by the viewer, one line under the whole
       reference (per line when it breaks), not per glyph as CSS would. */
  }
  .latex-block svg .latex-link.latex-link-active {
    fill: var(--latex-link-active, #c2410c) !important;
  }
  .latex-block svg .latex-link:focus-visible { outline: 2px solid currentColor; }
  /* Scroll destination for a \label. Zero height so it takes part in nothing;
     give it scroll-margin-top if the page has a sticky header. */
  .latex-anchor { height: 0; overflow: hidden; }


  /* ── AGPL source-offer notice ────────────────────────────────────────────
     latex-viewer.js is AGPL-3.0 and runs in the visitor's browser, so §13
     requires deployed pages to offer their users the Corresponding Source.
     This muted footer carries that offer; keep it (or an equivalent link) on
     any site you publish. It sits outside #lt-content so the width/zoom
     controls do not scale it. */
  #lt-agpl-notice {
    max-width: 46rem; margin: 4rem auto 2rem; padding: 0 1.25rem;
    font-size: 0.75rem; line-height: 1.5; text-align: center; opacity: 0.55;
  }
  #lt-agpl-notice a { color: inherit; }
</style>
</head>
<body>
<div id="lt-reader">
  <div id="lt-reader-panel" role="dialog" aria-label="Reading options" hidden>
    <div class="lt-row lt-size" role="group" aria-label="Text size">
      <button type="button" data-z="out" aria-label="Smaller text" title="Smaller">A</button>
      <button type="button" data-z="reset" id="zoom-level" aria-label="Reset text size" title="Reset">100%</button>
      <button type="button" data-z="in" aria-label="Larger text" title="Larger">A</button>
    </div>
    <div class="lt-row lt-themes" role="radiogroup" aria-label="Colour theme">
      <button type="button" role="radio" data-t="light" aria-checked="false"><span class="lt-swatch" aria-hidden="true">Aa</span><span>Light</span></button>
      <button type="button" role="radio" data-t="dark" aria-checked="false"><span class="lt-swatch" aria-hidden="true">Aa</span><span>Dark</span></button>
      <button type="button" role="radio" data-t="sepia" aria-checked="false"><span class="lt-swatch" aria-hidden="true">Aa</span><span>Sepia</span></button>
      <button type="button" role="radio" data-t="contrast" aria-checked="false"><span class="lt-swatch" aria-hidden="true">Aa</span><span>Contrast</span></button>
    </div>
    <div class="lt-row">
      <p class="lt-caption" id="lt-width-label">Text width</p>
      <div class="lt-seg" role="radiogroup" aria-labelledby="lt-width-label">
        <button type="button" role="radio" data-w="auto" aria-checked="false">Auto</button>
        <button type="button" role="radio" data-w="narrow" aria-checked="false">Narrow</button>
        <button type="button" role="radio" data-w="normal" aria-checked="false">Normal</button>
        <button type="button" role="radio" data-w="wide" aria-checked="false">Wide</button>
      </div>
    </div>
    <div class="lt-row">
      <button type="button" class="lt-inspect-row" data-inspect title="The boxes and glue behind the page">
        <span>Inspect boxes and glue</span><kbd class="lt-inspect-key"></kbd>
      </button>
    </div>
  </div>
  <button type="button" id="lt-reader-button" aria-haspopup="dialog" aria-expanded="false"
          aria-controls="lt-reader-panel" title="Reading options">
    <span class="lt-aa" aria-hidden="true">Aa</span>
    <span class="sr-only">Reading options</span>
  </button>
</div>
<script>
(function () {
  var root = document.getElementById('lt-reader');
  var btn = document.getElementById('lt-reader-button'), panel = document.getElementById('lt-reader-panel');
  var html = document.documentElement;
  function sync() {
    root.querySelectorAll('[data-t]').forEach(function (b) {
      b.setAttribute('aria-checked', String(html.getAttribute('data-theme') === b.dataset.t)); });
    root.querySelectorAll('[data-w]').forEach(function (b) {
      b.setAttribute('aria-checked', String((html.getAttribute('data-width') || 'auto') === b.dataset.w)); });
  }
  function open(on) {
    panel.hidden = !on;
    btn.setAttribute('aria-expanded', String(on));
    if (on) { sync(); (panel.querySelector('[aria-checked="true"]') || panel.querySelector('button')).focus(); }
  }
  btn.addEventListener('click', function () { open(panel.hidden); });
  document.addEventListener('pointerdown', function (e) { if (!panel.hidden && !root.contains(e.target)) open(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) { open(false); btn.focus(); } });
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.t) window.__setTheme(b.dataset.t);
    if (b.dataset.w) window.__setWidth(b.dataset.w);
    if (b.dataset.z) window.__zoom(b.dataset.z === 'out' ? -1 : b.dataset.z === 'in' ? 1 : 0);
    sync();
  });
  sync();
})();
</script>

<main id="lt-content">
<h1>{{TITLE}}</h1>

{{BLOCKS}}
</main>

<!-- protobuf.min.js must load before latex-viewer.js (it exposes global `protobuf`). -->
<script src="protobuf.min.js"></script>
<script src="latex-viewer.js"></script>
<!-- The inspector (src/inspector): the boxes and glue behind the blocks.
     Alt+Shift+I (⌥⇧I) or the reading panel's entry opens it; its panel and
     agent load from beside inspector.js only then. -->
<script src="inspector/inspector.js"></script>
<script>
(function () {
  var ins = window.reflowtex && window.reflowtex.inspector, b = document.querySelector('[data-inspect]');
  if (!ins) { b.parentNode.hidden = true; return; }
  b.querySelector('.lt-inspect-key').textContent = ins.shortcut;
  b.addEventListener('click', function () {
    document.getElementById('lt-reader-button').click();   // close the reading panel
    ins.open();
  });
})();
</script>
</body>
</html>
