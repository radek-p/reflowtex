// Protobuf schema for the LaTeX node list. Replaces schema.kiwi.
//
// proto2 (not proto3) on purpose: the renderer relies on field *presence* – a
// glyph carries `metrics` but no width; a box carries `shift` only when shifted;
// gW falls back on `width === undefined`. proto2 tracks presence explicitly, so
// an unset field decodes as absent (undefined in JS via toObject{defaults:false},
// missing in Python via HasField), exactly as the kiwi format behaved. proto3
// would default unset scalars to 0 and lose that distinction.
//
// Enum values are lowercased to match the strings the renderer compares against
// (`n.type === 'glyph'`, `it.kind === 'display'`): protobuf.js toObject({enums:
// String}) then yields those strings directly, with no translation layer.
//
// Floats are `double` (kiwi only had 32-bit float): glue_set and the transform
// matrix now round-trip Lua's float64 exactly, removing the precision question.

syntax = "proto2";

package latex;

enum NodeType {
  glyph     = 0;
  glue      = 1;
  kern      = 2;
  rule      = 3;
  hlist     = 4;
  vlist     = 5;
  disc      = 6;
  penalty   = 7;
  math      = 8;
  picture   = 9;   // a captured TikZ box or included PDF, drawn from precompiled SVG
  transform = 10;  // \rotatebox and friends: a matrix applied to `children`
}

message Node {
  optional NodeType type          = 1;
  optional int32    char          = 2;   // glyph: Unicode codepoint
  optional uint32   font          = 3;   // glyph: font ID
  optional int32    width         = 4;   // glue/kern/rule/hlist/vlist (glyphs use `metrics`)
  optional int32    height        = 5;   // rule/hlist/vlist
  optional int32    depth         = 6;   // rule/hlist/vlist
  optional int32    stretch       = 7;   // glue
  optional int32    shrink        = 8;   // glue
  optional uint32   stretch_order = 9;   // glue (omitted when 0)
  optional uint32   shrink_order  = 10;  // glue (omitted when 0)
  optional uint32   subtype       = 11;  // glue/disc (omitted when 0)
  optional int32    kern          = 12;  // kern: spacing amount
  optional int32    shift         = 13;  // hlist/vlist (omitted when 0)
  optional double   glue_set      = 14;  // hlist/vlist: pre-computed glue ratio
  optional uint32   glue_sign     = 15;  // hlist/vlist (omitted when 0)
  optional uint32   glue_order    = 16;  // hlist/vlist (omitted when 0)
  repeated Node     children      = 17;  // hlist/vlist (recursive)
  repeated Node     pre           = 18;  // disc
  repeated Node     post          = 19;  // disc
  repeated Node     replace       = 20;  // disc
  optional int32    penalty       = 21;  // penalty: break penalty value
  optional int32    surround      = 22;  // math: thin-space width
  optional string   color         = 23;  // glyph/rule: CSS hex colour; absent = default text colour
  optional uint32   picture       = 24;  // picture: 1-based index into Document.pictures
  optional Node     leader        = 25;  // glue: box tiled across the set width (\cleaders, arrows)

  // transform: the PDF matrix [a b c d] from \rotatebox/\reflectbox/\scalebox,
  // applied about the current point. No metrics of its own – it only wraps its
  // children (the enclosing box was already sized by TeX).
  optional double   m_a           = 26;
  optional double   m_b           = 27;
  optional double   m_c           = 28;
  optional double   m_d           = 29;

  // glyph: citation wiring. `cite` links a \lrcite number's glyphs; `citetarget`
  // marks a bibliography [n] label.
  optional uint32   cite          = 30;
  optional uint32   citetarget    = 31;

  // glyph: 1-based index into Document.glyph_metrics. A glyph's width/height/
  // depth are interned there (the same box repeats across thousands of glyphs)
  // and referenced here instead of stored inline. Only glyphs use this.
  optional uint32   metrics       = 32;

  // glyph: 1-based index into Document.streams of a stream this glyph refers
  // to. A footnote marker points at its body this way, and the browser shows
  // it as a popover; the stream's `kind` says what it is. (See Stream below;
  // field 33 was the footnote id before streams.) Declared at the end.
  reserved 33;

  // Per-scaled-point derivatives recovered from several wide compilations.
  // Only fields which actually vary are present. The viewer evaluates them at
  // its current column width; all node kinds share this one generic mechanism.
  optional double width_rate    = 34;
  optional double height_rate   = 35;
  optional double depth_rate    = 36;
  optional double stretch_rate  = 37;
  optional double shrink_rate   = 38;
  optional double kern_rate     = 39;
  optional double shift_rate    = 40;
  optional double glue_set_rate = 41;
  optional double surround_rate = 42;
  optional double m_a_rate      = 43;
  optional double m_b_rate      = 44;
  optional double m_c_rate      = 45;
  optional double m_d_rate      = 46;
  // This horizontal field was nonnegative throughout the accepted samples;
  // the viewer may impose its configurable positive floor before scrolling.
  optional bool width_floor    = 47;
  optional bool kern_floor     = 48;
  optional bool surround_floor = 49;

  // glyph: the cross-reference this glyph is part of – a 1-based index into
  // Document.links. Every glyph a \ref printed carries the same id, so a
  // reference stays one link however the browser re-breaks the line it sits on.
  optional uint32 link   = 50;
  // hlist: an empty, zero-sized box marking where a \label stood – a 1-based
  // index into Document.anchors. The box is ordinary in every other respect.
  optional uint32 anchor = 51;
  optional uint32 stream = 52;
  // glyph/glue: part of a \webtext slot's default text – a 1-based index into
  // Document.slots. A page may replace the text from JavaScript (see Slot).
  optional uint32 slot   = 53;
}

// A named placeholder in running text (\webtext{name}{default} in
// reflowtex.sty). TeX typesets the default; a page may replace it with any
// string, which the viewer then sets as the browser would – words measured in
// the slot's font, no kerning or ligatures across them, and between words the
// interword glue of that font, recorded here (\fontdimen2–4, sp), so the
// paragraph re-breaks around the new text.
message Slot {
  optional string name    = 1;
  optional int32  space   = 2;
  optional int32  stretch = 3;
  optional int32  shrink  = 4;
  // "widget" for \webwidget: the page draws HTML there, which it measures
  // and may break across lines (see the viewer's widgets). Absent: text.
  optional string kind    = 5;
}

// What one link points at. Exactly one field is set: `label` for a cross
// reference inside this document (which only the publishing site can turn into a
// URL – see Document.links), `url` for a destination the author wrote out in
// full, which needs no resolving.
message Link {
  optional string label  = 1;
  optional string url    = 2;
  // Not a destination but a control: the glyphs trigger this action in the
  // page (\webaction in reflowtex.sty – "pane:next" for an accordion's
  // \webnextpane). The viewer sends it as a bubbling `reflowtex:action` DOM
  // event from the glyph, and whichever enclosing stream kind understands it
  // handles it.
  optional string action = 3;
}

// One distinct glyph box (width/height/depth in sp), referenced by Node.metrics.
message GlyphMetrics {
  optional int32 width  = 1;
  optional int32 height = 2;
  optional int32 depth  = 3;
}

// A precompiled TikZ box or included PDF page. `svg` is the markup inside the
// wrapping <g> (ids namespaced, colours rewritten to CSS custom properties).
// vb_w/vb_h are the source viewBox, scaled to the node's TeX width.
message Picture {
  optional string svg  = 1;
  optional double vb_w = 2;
  optional double vb_h = 3;
}

message FontInfo {
  optional uint32 id       = 1;
  optional string name     = 2;
  optional uint32 size_sp  = 3;
  optional string filename = 4;

  // Microtypography as TeX had it while typesetting – what microtype (or a
  // preamble using \lpcode, \rpcode and \expandglyphsinfont directly) set on
  // this font – in TeX's own units, so a breaker running TeX's algorithm
  // protrudes and expands exactly as TeX did. `quad` (sp) is what protrusion
  // codes are relative to. expand_* are \expandglyphsinfont's three
  // arguments (thousandths); all absent = the font does not expand. `codes`
  // lists only the characters with a non-default code.
  optional int32     quad           = 5;
  optional int32     expand_stretch = 6;
  optional int32     expand_shrink  = 7;
  optional int32     expand_step    = 8;
  repeated CharCodes codes          = 9;
}

// One character's protrusion and expansion codes: lp/rp are \lpcode/\rpcode
// (thousandths of the font's quad, hanging into the left/right margin), ef is
// \efcode (thousandths of the character's width; 1000 = expands like the
// rest of the font).
message CharCodes {
  optional int32 char = 1;
  optional int32 lp   = 2;
  optional int32 rp   = 3;
  optional int32 ef   = 4;
}

message Paragraph {
  repeated Node  nodes  = 1;
  optional int32 indent = 2;  // sp; left offset from \parshape, 0 normally
  // TeX interline parameters (sp) so the renderer reproduces the exact
  // baseline-to-baseline advance when it re-breaks the paragraph.
  optional int32 baselineskip  = 3;
  optional int32 lineskip      = 4;
  optional int32 lineskiplimit = 5;
  // Per-paragraph alignment from TeX's \leftskip/\rightskip: "center", "left"
  // (\raggedright), or "right" (\raggedleft). Absent = justified (the default),
  // so the paragraph inherits the block's --latex-align.
  optional string align = 6;

  // \adjustspacing and \protrudechars in force when TeX broke the paragraph
  // (LuaTeX's meaning: 0 = off, 1 = applied when a line is set, 2 = also
  // inside the line breaker; microtype sets both to 2). They say whether the
  // FontInfo expansion and protrusion codes were in use. Absent = 0.
  optional int32 adjust_spacing = 8;
  optional int32 protrude_chars = 9;
  // The paragraph's measure (\hsize, sp) at Document.source_width. With
  // `indent` this places the paragraph's band inside the source column: a
  // quote environment's right margin is source_width - indent - width, and
  // the viewer keeps both margins when it re-breaks at another width.
  optional int32 width = 7;
}

enum ItemKind {
  paragraph = 0;
  display   = 1;
  vspace    = 2;
  // A \label that stood between two items rather than inside one – the usual
  // case, since \label follows a sectioning command in vertical mode.
  anchorpoint = 3;
  // A separately typeset stream embedded at this point of the flow: what
  // \begin{webstream}{kind} wraps. Its content is
  // Document.streams[ContentItem.stream - 1].
  stream = 4;
}

message ContentItem {
  optional ItemKind kind   = 1;
  optional uint32   para   = 2;  // paragraph: 1-based index into Document.paragraphs
  optional Node     box    = 3;  // display: the finished hlist, glue already set
  optional int32    amount = 4;  // vspace: vertical gap in sp

  // display: the band [display_indent, display_indent+display_width] the display
  // occupied, and where TeX shifted the box within it.
  optional int32 display_width  = 5;
  optional int32 display_indent = 6;
  optional int32 display_shift  = 7;
  optional double display_width_rate  = 8;
  optional double display_indent_rate = 9;
  optional double display_shift_rate  = 10;
  optional bool display_shift_floor = 11;
  // display (an equation, not an alignment row): what TeX chose the skips
  // around it with. TeX uses \abovedisplayskip/\belowdisplayskip when the
  // display's left edge is at or left of where the line before it ends
  // (\predisplaysize: that line's last ink + 2em; -\maxdimen when the
  // display began its paragraph), the short pair otherwise. The viewer
  // re-breaks that line, so it redoes the choice: display_pre_size is TeX's
  // value at source_width, display_above .. display_below_short the four
  // skips in force, display_used_above/below the ones TeX used – they are
  // components of the vspace items before and after the display, which the
  // viewer swaps for its own choice – and display_after_line says a set line
  // of a paragraph stood directly before the display (otherwise
  // display_pre_size stands as captured).
  optional int32 display_pre_size    = 14;
  optional int32 display_above       = 15;
  optional int32 display_above_short = 16;
  optional int32 display_below       = 17;
  optional int32 display_below_short = 18;
  optional int32 display_used_above  = 19;
  optional int32 display_used_below  = 20;
  optional bool  display_after_line  = 21;
  // the em (quad of the font current at the display) TeX measured
  // \predisplaysize with, and the interline glue TeX set before the display
  // and before the line after it (also components of those vspace items):
  // the viewer sets its own from its line depths.
  optional int32 display_quad            = 22;
  optional int32 display_interline_above = 23;
  optional int32 display_interline_below = 24;
  // the leading TeX appended the display with – \baselineskip, \lineskip
  // and \lineskiplimit as set inside the display (amsmath opens them up by
  // \jot in split and multline), which the interline glue above it follows
  optional int32 display_baselineskip  = 25;
  optional int32 display_lineskip      = 26;
  optional int32 display_lineskiplimit = 27;
  // the least space LaTeX's \addvspace asked for below the display (a
  // theorem's or list's \topsep) while the below skip was \lastskip: the
  // space below is the larger of the skip and this
  optional int32 display_after_min     = 28;

  // anchorpoint: 1-based index into Document.anchors.
  optional uint32 anchor = 12;
  // stream: 1-based index into Document.streams.
  optional uint32 stream = 13;
}

// A separately typeset run of content – its own paragraphs, displays and
// vertical space, over the document's shared paragraph and font tables –
// referenced from wherever it belongs: a glyph (Node.stream: a footnote
// marker pointing at its body) or a content item (ContentItem.stream: a block
// the author wrapped in \begin{webstream}{kind}). One mechanism serves
// footnotes, collapsible sections, framed boxes, table cells and popovers:
// the producer names the kind, the viewer decides how a kind is shown (see
// src/viewer/README.md, "Streams"). Streams nest: a stream's content may
// itself hold stream items.
message Stream {
  optional string      kind    = 1;  // "footnote", or the kind the author gave
  repeated ContentItem content = 2;
  // Parameters the author gave the stream,
  // \begin{webstream}[initial=collapsed]{accordion}. The viewer puts
  // each on the stream's element as data-KEY and hands them to the kind.
  repeated StreamAttr  attrs   = 3;
  // Text the stream carries as text rather than typeset, for its kind to show
  // itself: the source of a \\begin{lean} block (reflowtex.sty), drawn by the
  // viewer as highlighted code.
  optional string      text    = 4;
}

message StreamAttr {
  optional string key   = 1;
  optional string value = 2;
}

message Document {
  repeated FontInfo     fonts         = 1;
  repeated Paragraph    paragraphs    = 2;
  repeated ContentItem  content       = 3;
  repeated Picture      pictures      = 4;
  repeated GlyphMetrics glyph_metrics = 5;  // interned glyph boxes; see Node.metrics
  reserved 6;                          // was: repeated Footnote footnotes
  // Width at which the stored display geometry was compiled. `display_model`
  // says that rate fields were verified against a stable three-sample window.
  optional int32        source_width   = 7;
  optional bool         display_model  = 8;

  // The label each cross-reference points at, and the label each anchor marks,
  // as the author wrote them. Resolving a label to a URL is deliberately not
  // done here: only the site publishing these blocks knows what page a label
  // ended up on. See the DOM contract in src/viewer/README.md.
  reserved 9;                          // was: repeated string links
  repeated string       anchors        = 10;
  repeated Link         links          = 11;
  repeated Stream       streams        = 12;
  // The document's outline, in order: sections and subsections, and
  // theorem-like environments, each with the anchor marking its place.
  repeated OutlineEntry outline        = 13;
  repeated Slot         slots          = 14;
}

message OutlineEntry {
  optional string kind   = 1;  // section, subsection, subsubsection, or theorem
  optional string env    = 2;  // theorem: the environment's name (thm, lem, …)
  optional uint32 level  = 3;  // 1 section, 2 subsection, 3 subsubsection, 9 theorem
  optional string number = 4;  // as printed: "3.1"; may be empty
  optional string title  = 5;  // plain text: "Enumeration of …", "Theorem (Main)"
  optional uint32 anchor = 6;  // 1-based index into Document.anchors
}
