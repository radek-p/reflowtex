<script>
  (function () {                                   
    var KEY = 'reflowtex-theme';
    function set(t) {
      var root = document.documentElement;
      root.classList.remove('dark', 'sepia', 'contrast');
      if (t !== 'light') root.classList.add(t);
      root.setAttribute('data-theme', t);
      try { localStorage.setItem(KEY, t); } catch (e) {}
    }
    var saved; try { saved = localStorage.getItem(KEY); } catch (e) {}
    set(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    window.__setTheme = set;
  })();
  (function () {                                   
    var KEY = 'reflowtex-width';
    function set(w) {
      document.documentElement.setAttribute('data-width', w);
      try { localStorage.setItem(KEY, w); } catch (e) {}
    }
    var saved; try { saved = localStorage.getItem(KEY); } catch (e) {}
    set(saved || 'auto');
    window.__setWidth = set;
  })();
  (function () {                                   
    var KEY = 'reflowtex-zoom', MIN = 0.5, MAX = 3, STEP = 1.1, z = 1;
    function clamp(v) { return Math.min(MAX, Math.max(MIN, v)); }
    function apply() {
      document.documentElement.style.setProperty('--lt-zoom', z);
      var el = document.getElementById('zoom-level');
      if (el) el.textContent = Math.round(z * 100) + '%';
      try { localStorage.setItem(KEY, String(z)); } catch (e) {}
      window.dispatchEvent(new Event('resize'));
    }
    var saved; try { saved = parseFloat(localStorage.getItem(KEY)); } catch (e) {}
    if (saved > 0) z = clamp(saved);
    document.documentElement.style.setProperty('--lt-zoom', z);
    window.__zoom = function (dir) { z = dir === 0 ? 1 : clamp(z * (dir > 0 ? STEP : 1 / STEP)); apply(); };
    document.addEventListener('DOMContentLoaded', function () {
      var el = document.getElementById('zoom-level');
      if (el) el.textContent = Math.round(z * 100) + '%';
    });
  })();
</script>

  .demo-link { margin: 1.5rem 0 0.5rem; }

    display: inline-block; text-decoration: none; font-size: 0.95rem;
    padding: 0.55rem 1.2rem; border-radius: 999px;
    border: 1px solid color-mix(in srgb, currentColor 30%, transparent);

  .hero { text-align: center; padding: 3.5rem 1rem 2.5rem; }
  .hero .kicker {
    font-size: 0.8rem; letter-spacing: 0.34em; text-transform: uppercase;
    opacity: 0.5; font-weight: 600; padding-left: 0.34em;
  }
   
  #stage {
    box-sizing: border-box; width: min(720px, calc(100vw - 2rem)); height: 18rem;
    margin: 1.6rem auto 0; padding: 0 clamp(0.5rem, 3vw, 2rem);
    border-left: 1px dashed color-mix(in srgb, currentColor 18%, transparent);
    border-right: 1px dashed color-mix(in srgb, currentColor 18%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  #hero-flow { width: 100%; overflow: hidden; }          
  #stage .latex-block { width: 100%; margin: 0; }
  .hero .tagline { max-width: 34rem; margin: 1.8rem auto 0; opacity: 0.62; font-size: 0.95rem; }
  .hero .cta { margin-top: 1.6rem; display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
  .hero .cta a {
    text-decoration: none; padding: 0.5rem 1.1rem; border-radius: 999px;
    border: 1px solid color-mix(in srgb, currentColor 30%, transparent); font-size: 0.9rem;
  }
  .hero .cta a.primary { background: color-mix(in srgb, currentColor 14%, transparent); }
  @media (prefers-reduced-motion: reduce) { .hero .tagline .motion { display: none; } }

   
  #lt-switches {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 1000;
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.4rem;
  }
  @media (max-width: 34rem) { #lt-switches { flex-direction: column; align-items: flex-end; } }
  .lt-switch {
    display: flex; gap: 2px; padding: 3px; border-radius: 999px; font-size: 0.72rem;
    background: color-mix(in srgb, currentColor 12%, transparent);
    border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
    box-shadow: 0 1px 8px color-mix(in srgb, currentColor 14%, transparent);
    backdrop-filter: blur(6px);
  }
  .lt-switch button {
    border: 0; background: none; color: inherit; cursor: pointer; font: inherit;
    padding: 0.3rem 0.6rem; border-radius: 999px; opacity: 0.7;
    letter-spacing: 0.02em; white-space: nowrap;
  }
  .lt-switch button:hover { opacity: 1; }
  #zoom-switch button[data-z="reset"] { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
  html[data-width="auto"]     #width-switch button[data-w="auto"],
  html:not([data-width])      #width-switch button[data-w="auto"],
  html[data-width="narrow"]   #width-switch button[data-w="narrow"],
  html[data-width="normal"]   #width-switch button[data-w="normal"],
  html[data-width="wide"]     #width-switch button[data-w="wide"],
  html[data-theme="light"]    #theme-switch button[data-t="light"],
  html[data-theme="dark"]     #theme-switch button[data-t="dark"],
  html[data-theme="sepia"]    #theme-switch button[data-t="sepia"],
  html[data-theme="contrast"] #theme-switch button[data-t="contrast"] {
    opacity: 1; background: color-mix(in srgb, currentColor 18%, transparent);
  }
</style>
