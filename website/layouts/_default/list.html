{{ define "main" }}
<main id="lt-content">
<h1{{ if .Params.latexTitle }} class="sr-only"{{ end }}>{{ .Title }}</h1>
{{ .Content }}
{{ with .Pages }}
<ul class="child-list">
  {{ range . }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
</ul>
{{ end }}
</main>
{{ end }}
